<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile | CampusShare</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/profile.css" />
</head>
<body>

  <header id="appbar"></header>

  <main class="container">

    <!-- ===================== IDENTITY ===================== -->
    <section class="profile-card">

      <div class="profile-top">

        <div class="photo-wrapper">
          <img id="profilePhoto" class="profile-photo" src="../images/default-avatar.svg" alt="Your profile photo" />
          <button type="button" id="changePhotoBtn" class="camera-btn" aria-label="Change profile photo"></button>
          <input type="file" id="photoInput" accept="image/png, image/jpeg" hidden />
        </div>

        <div class="basic-info">
          <h1 id="profileName" class="profile-name-heading">Loading...</h1>
          <p id="profileBranchBatch" class="branch-batch-line"></p>

          <!-- Verification: clicking the banner opens the ID card picker -->
          <button type="button" id="verifyBanner" class="verify-banner">
            <span>Add your ID card to get verified</span>
          </button>
          <p id="verifiedBadge" class="badge badge-verified verified-badge hidden">
            <span>Verified student</span>
          </p>
          <input type="file" id="idCardInput" accept="image/png, image/jpeg" hidden />
        </div>

      </div>

      <!-- Account details -->
      <dl class="details-grid">
        <div class="detail-item">
          <span class="detail-icon" data-icon="mail"></span>
          <div>
            <dt class="detail-label">Email</dt>
            <dd id="profileEmail">-</dd>
          </div>
        </div>

        <div class="detail-item">
          <span class="detail-icon" data-icon="id-card"></span>
          <div>
            <dt class="detail-label">Enrollment number</dt>
            <dd id="profileEnrollment">-</dd>
          </div>
        </div>

        <div class="detail-item">
          <span class="detail-icon" data-icon="building"></span>
          <div>
            <dt class="detail-label">Branch</dt>
            <dd id="profileBranch">-</dd>
          </div>
        </div>

        <div class="detail-item">
          <span class="detail-icon" data-icon="graduation-cap"></span>
          <div>
            <dt class="detail-label">Batch</dt>
            <dd id="profileBatch">-</dd>
          </div>
        </div>
      </dl>

    </section>

    <!-- ===================== STATS ===================== -->
    <section class="stats-row" aria-label="Your sharing summary">
      <div class="stat-box">
        <p class="stat-value" id="statMyRequests">0</p>
        <p class="stat-label">Requests posted</p>
      </div>
      <div class="stat-box">
        <p class="stat-value" id="statCompleted">0</p>
        <p class="stat-label">Completed</p>
      </div>
      <div class="stat-box">
        <p class="stat-value" id="statOngoing">0</p>
        <p class="stat-label">Ongoing</p>
      </div>
      <div class="stat-box">
        <p class="stat-value" id="statPeopleHelped">0</p>
        <p class="stat-label">People helped</p>
      </div>
    </section>

    <!-- ===================== MY REQUESTS ===================== -->
    <section class="my-requests-section" aria-labelledby="myRequestsHeading">
      <div class="my-requests-header">
        <h2 id="myRequestsHeading">My requests</h2>
        <a href="post-need.html" class="btn btn-secondary btn-sm" id="postNeedBtn">
          <span>Post a need</span>
        </a>
      </div>

      <div id="myRequestsContainer" class="requests-list" aria-busy="true"></div>
    </section>

    <div class="logout-wrapper">
      <button type="button" id="logoutBtn" class="btn btn-danger">
        <span>Log out</span>
      </button>
    </div>

  </main>

  <nav id="bottomNav"></nav>

  <script src="../js/ui.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
