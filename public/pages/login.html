<!DOCTYPE html>
<html lang="en">

  <title>Login | CampusShare</title>
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>

  <!--
    PAGE STRUCTURE (easy to explain):
    1. Back arrow (goes to signup page)
    2. White card with the login form inside it
  -->

  <div class="page">

    <a href="./signup.html" class="back-arrow">←</a>

    <div class="login-card">

      <h1 class="login-title">Welcome back! 👋</h1>
      <p class="login-subtitle">Login to continue</p>

      <!-- Login form -->
      <form id="loginForm">

        <div class="form-group">
          <label for="email">Email / University Email</label>
          <input type="email" id="email" name="email" placeholder="e.g. jhankar@bmu.edu.in" required>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="#" class="forgot-link">Forgot?</a>
          </div>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="login-btn">Login</button>

      </form>

      <!-- Divider -->
      <div class="divider">
        <span>or continue with</span>
      </div>

      <!-- Other login options -->
      <div class="social-buttons">
        <button type="button" class="social-btn">
          <span>🔵</span> Google
        </button>
        <button type="button" class="social-btn">
          <span>🎓</span> University Email
        </button>
      </div>

      <p class="signup-text">Don't have an account? <a href="./signup.html">Signup</a></p>

    </div>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
