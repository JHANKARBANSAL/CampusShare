<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in | CampusShare</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body class="auth-body">

  <div class="auth-split">

    <!-- ============ LEFT: identity + value proposition ============ -->
    <aside class="auth-aside">
      <a href="./login.html" class="brand auth-brand" id="asideBrand">CampusShare</a>

      <div class="auth-pitch">
        <h2>Borrow less.<br />Share more.<br />Build community.</h2>
        <p>The things you need for one afternoon are already sitting in someone's hostel room.</p>
      </div>

      <ul class="auth-points" id="authPoints"></ul>
    </aside>

    <!-- ============ RIGHT: form ============ -->
    <main class="auth-main">
      <div class="auth-card">

        <a href="./signup.html" class="auth-back" id="authBack">
          <span class="sr-only">Back to sign up</span>
        </a>

        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Log in to see what your campus needs today.</p>

        <!-- Backend message (login.js writes here) -->
        <p id="message" class="form-message" role="alert"></p>

        <form id="loginForm" novalidate>

          <div class="field">
            <label for="email">University email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="input"
              placeholder="you@university.edu"
              autocomplete="email"
              data-label="University email"
              required
            />
            <p class="field-error" id="emailError"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input
                type="password"
                id="password"
                name="password"
                class="input"
                placeholder="Enter your password"
                autocomplete="current-password"
                data-label="Password"
                required
              />
              <button type="button" class="password-toggle" data-target="password" aria-label="Show password" aria-pressed="false"></button>
            </div>
            <p class="field-error" id="passwordError"></p>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Continue</button>

        </form>

        <p class="auth-alt">New here? <a href="./signup.html">Create an account</a></p>

      </div>
    </main>

  </div>

  <script src="../js/ui.js"></script>
  <script src="../js/auth-ui.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
