<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore | CampusShare</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>

  <!-- Shared app navigation, built by ui.js so every page stays identical -->
  <header id="appbar"></header>

  <main class="container">

    <!-- ============ DISCOVERY HEADER ============ -->
    <section class="discover">
      <h1 class="discover-greeting" id="dashGreeting">Welcome back</h1>
      <p class="discover-sub">Find what you need around campus.</p>

      <form class="search-form" id="searchForm" role="search">
        <label class="sr-only" for="searchInput">Search requests</label>
        <span class="search-icon" id="searchIcon" aria-hidden="true"></span>
        <input
          type="search"
          id="searchInput"
          class="input search-input"
          placeholder="Search calculator, textbook, tripod..."
          autocomplete="off"
        />
        <button type="button" id="searchClear" class="search-clear" aria-label="Clear search" hidden></button>
      </form>

      <!-- Quick filters run against the item name and description of real
           requests — the API has no category field, so these are search
           shortcuts rather than a fixed taxonomy. -->
      <div class="chip-row" id="quickFilters" role="group" aria-label="Quick filters"></div>
    </section>

    <!-- ============ REQUEST FEED ============ -->
    <section class="requests" aria-labelledby="requestsHeading">

      <div class="requests-bar">
        <div>
          <h2 id="requestsHeading">Requests near you</h2>
          <p class="requests-count" id="requestsCount" aria-live="polite"></p>
        </div>

        <div class="chip-row sort-row" id="sortControls" role="group" aria-label="Sort and filter requests"></div>
      </div>

      <!-- Cards are injected here from GET /api/needs -->
      <div id="requestsContainer" class="requests-grid" aria-busy="true"></div>

    </section>

  </main>

  <nav id="bottomNav"></nav>

  <script src="../js/ui.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
