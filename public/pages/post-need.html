<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Post a Need | CampusShare</title>

    <!-- Load order wahi hai jo baaki pages pe hai:
         tokens -> components -> nav -> page ki apni CSS.

         Pehle yahan sirf nav.css aur post-need.css thi. nav.css
         poori tarah var(--card), var(--line), var(--s-6) jaise
         tokens pe chalti hai, aur wo tokens is page pe load hi
         nahi hote the - isliye navbar yahan baaki pages se
         alag dikhta tha. -->

    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/post-need.css">
</head>


<body>

<!-- Icon sprite. Baaki pages ki tarah navbar ke icons ab
     yahan se aate hain, PNG files se nahi. -->
<script src="../js/icons.js"></script>

    <!-- =========================
         NAVBAR
    ========================== -->

  <!-- ================= NAVBAR =================
       Ye markup HAR page pe bilkul same hai.
       Style nav.css me hai, naam nav.js bharta hai.
  ========================================== -->

  <header class="navbar">

    <a href="./dashboard.html" class="logo">
      <img
        src="../images/image-removebg-preview (1).png"
        alt="CampusShare"
        class="logo-image"
      >
    </a>

    <span class="nav-divider"></span>

    <nav class="menu">

        <a href="./dashboard.html" class="nav-link">
          <svg class="icon nav-icon" aria-hidden="true"><use href="#i-home"></use></svg>
          <span>Home</span>
        </a>

        <a href="./activity.html" class="nav-link">
          <svg class="icon nav-icon" aria-hidden="true"><use href="#i-activity"></use></svg>
          <span>My Activity</span>
        </a>

        <a href="./post-need.html" class="nav-link active">
          <svg class="icon nav-icon" aria-hidden="true"><use href="#i-search"></use></svg>
          <span>Looking For</span>
        </a>

        <a href="./profile.html" class="nav-link">
          <svg class="icon nav-icon" aria-hidden="true"><use href="#i-user"></use></svg>
          <span>Profile</span>
        </a>

    </nav>

    <span class="nav-divider"></span>

    <div class="navbar-right">

      <a href="./profile.html" class="nav-user">
        <span class="nav-avatar" id="navAvatar"></span>
        <span id="navUserName"></span>
        <span class="arrow">
          <svg class="icon" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
        </span>
      </a>

    </div>

  </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="post-need-page">


        <!-- BACK BUTTON -->

        <a href="./dashboard.html"
           class="back-link">

            ← Back to Dashboard

        </a>


        <!-- =========================
             FORM CARD
        ========================== -->

        <section class="form-card">

            <div class="form-header">

                <h1>I Need Something</h1>

                <p>
                    Tell the campus community what you're looking for.
                </p>

            </div>


            <!-- AI Post Assistant: student ek line likhta hai,
                 AI use itemName/description/date/duration mein
                 tod ke form khud bhar deta hai. Student check
                 karke submit karta hai, seedha post nahi hota. -->
            <section class="ai-assist-box">

                <label for="aiText">
                    Ya bas ek line mein bata do kya chahiye
                </label>

                <textarea
                    id="aiText"
                    placeholder="e.g. kal subah exam ke liye calculator chahiye, 2 ghante ke liye"
                    rows="2"
                ></textarea>

                <button type="button" id="aiFillBtn" class="ai-fill-btn">
                    AI Se Form Bharo
                </button>

                <p id="aiStatus" class="ai-status"></p>

            </section>


            <!-- Message shown after the form is submitted (hidden until JS shows it) -->
            <div id="successMessage" class="success-message">
                ✅ Your request has been posted!
            </div>

            <!-- =========================
                 NEED FORM
            ========================== -->

            <form id="needForm">


                <!-- ITEM NAME -->

                <div class="form-group">

                    <label for="itemName">
                        What do you need?
                    </label>

                    <input
                        type="text"
                        id="itemName"
                        name="itemName"
                        placeholder="e.g. Scientific Calculator"
                        required
                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Why do you need it?
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="e.g. I need it for my mathematics exam."
                        rows="5"
                        required
                    ></textarea>

                </div>


                <!-- DATE AND TIME -->

                <div class="form-group">

                    <label for="neededBy">
                        When do you need it?
                    </label>

                    <input
                        type="datetime-local"
                        id="neededBy"
                        name="neededBy"
                        required
                    >

                </div>


                <!-- DURATION -->

                <div class="form-group">

                    <label for="duration">
                        For how long?
                    </label>

                    <input
                        type="number"
                        id="durationValue"
                        name="duration"
                        placeholder="e.g. 5"
                        required
                    >
                    <select id="durationUnit" required>
  <option value="hours">Hours</option>
  <option value="days">Days</option>
  <option value="weeks">Weeks</option>
</select>

                </div>


                <!-- FORM BUTTONS -->

                <div class="form-actions">

                    <a href="./dashboard.html"
                       class="cancel-btn">

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="submit-btn">

                        Post Request

                    </button>

                </div>


            </form>

            <p id="Message"></p>

        </section>

    </main>


    <!-- Post Need page ki JavaScript -->

    <script src="../js/post-need.js"></script>

    <script src="../js/nav.js"></script>
</body>

</html>
